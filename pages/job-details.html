<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details — Northstar Careers</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="candidate-page">
  <div class="app-shell">
    <aside class="sidebar">
      <button
  class="mobile-menu-btn"
  id="mobileMenuBtn"

>
  ☰
</button>
      <div class="brand">northstar <span>/ careers</span></div>
      <nav>
        <a href="dashboard.html">Overview</a>

      </nav>
