<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Northstar Careers</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="candidate-page">
  <div class="app-shell">
    <aside class="sidebar">
      <button
  class="mobile-menu-btn"
  id="mobileMenuBtn"
  aria-label="Open menu"
>
  ☰
</button>
      <div class="brand">northstar <span>/ careers</span></div>
      <nav>
        <a href="dashboard.html">Overview</a>
        <a href="jobs.html">Find jobs</a>
        <a href="applications.html">My applications</a>
        <a class="active" href="profile.html">My profile</a>
      </nav>
      <button id="logoutBtn" class="sidebar-logout">Log out</button>
    </aside>

    <main class="main-content narrow-content">
      <header class="topbar"><div><p class="eyebrow">CANDIDATE PROFILE</p><h1>Your profile.</h1></div></header>
      <div class="panel">
        <form id="profileForm" class="form-grid">
          <label>Full name<input id="profileName" placeholder="Full name" required></label>
          <label>Email<input id="profileEmail" type="email" placeholder="***@gmail.com" readonly></label>
          <label>Phone<input id="profilePhone" placeholder="+91 **********" required></label>
          <label>Education<input id="profileEducation" placeholder="Degree" required></label>
          <label class="full">Skills<textarea id="profileSkills" rows="5" placeholder="Skills..." required></textarea></label>
          <button class="btn btn-primary" type="submit">Save profile →</button>
          <p id="profileMessage" class="form-message full"></p>
        </form>
      </div>
    </main>
  </div>
  <script src="../js/common.js"></script>
  <script src="../js/profile.js"></script>

  <div id="logoutModal" class="logout-modal">
  <div class="logout-dialog">
    <div class="logout-icon">↪</div>

    <h2>Log out?</h2>

    <p>
      Are you sure you want to log out of your account?
    </p>

    <div class="logout-actions">
      <button id="cancelLogout" class="logout-cancel">
        Cancel
      </button>

      <button id="confirmLogout" class="logout-confirm">
        Log out
      </button>
    </div>
  </div>
</div>
</body>
</html>
